version: "3.8"

services:
  aegis-gateway:
    build: .
    container_name: aegis-gateway
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - PORT=8788
      - NODE_ENV=production
      - AEGIS_CACHE_ENABLED=true
      - AEGIS_SIMILARITY_THRESHOLD=0.90
      - AEGIS_GUARDRAILS_ENABLED=true
      # Upstream API keys (optional - mock engine activates if empty)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent SQLite volume for logs, keys, and semantic cache
      - aegis-data:/app
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  aegis-data:
